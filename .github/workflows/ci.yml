name: CI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node-version: [10.x, 12.x, 14.x]
        # macos-latest is arm64 and Node 10/12/14 publish no darwin-arm64 build,
        # so macOS runs the nearest Node with one (16.x) instead.
        exclude:
          - os: macos-latest
            node-version: 10.x
          - os: macos-latest
            node-version: 12.x
          - os: macos-latest
            node-version: 14.x
        include:
          - os: macos-latest
            node-version: 16.x

    steps:
      - name: Fix git checkout line endings
        run: git config --global core.autocrlf input
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Pin npm registry to release date
        run: |
          npm config set registry https://:2020-06-10T07%3A10%3A04.849Z@time-machines-npm.sealsecurity.io/
          npm config set always-auth true
          yarn config set registry https://:2020-06-10T07%3A10%3A04.849Z@time-machines-npm.sealsecurity.io/
      - name: Install
        run: yarn
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn coverage
      - name: Pack
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '14.x'
        run: npm pack
      - name: Upload artifact
        if: matrix.os == 'ubuntu-latest' && matrix.node-version == '14.x'
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: extract-zip-2.0.1.tgz
          if-no-files-found: error
